name: Secret Scan (SEC-W1)

# Dependency-free repository secret scan. Runs the high-precision, fail-closed
# scanner (Node built-ins only) on pushes and pull requests. Does not install
# any package. Blocks the pipeline if a confirmed secret pattern is found.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scanner self-tests
        run: node --test scripts/secret-scan.test.mjs

      - name: Scan tracked files for secrets
        run: node scripts/secret-scan.mjs
