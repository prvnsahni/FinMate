          content:
            application/json:
              schema:
                type: object
                required:
                  - balances
                  - suggestedSettlements
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - displayName
                        - netBalance
                        - currency
                      properties:
                        userId:
                          type: string
                          format: uuid
                        displayName:
                          type: string
                        netBalance:
                          type: number
                          description: Positive indicates creditor, negative indicates debtor.
                        currency:
                          type: string
                  suggestedSettlements:
                    type: array
                    items:
                      type: object
                      required:
                        - fromUserId
                        - toUserId
                        - amount
                        - currency
                      properties:
                        fromUserId:
                          type: string
                          format: uuid
                        toUserId:
                          type: string
                          format: uuid
