openapi: 3.0.3
info:
  title: FinMate API
  description: |
    API Contract for FinMate, a Personal Finance & Lifestyle Companion.
    Provides endpoints for Auth, Users, Groups, Expenses, Settlements, Notes, Goals, and Import/Export.

    ### Versioning Strategy
    URL-based versioning is used. All paths start with `/api/v1`.

    ### Pagination & Filtering
    Paginated GET endpoints support standard query parameters:
    * `page`: 1-based page index (default: `1`)
    * `limit`: Page size (default: `20`, max: `100`)
    * `cursor`: Cursor string (for cursor-based pagination on rapidly updated lists like Expenses and Audit Logs)
  version: 1.0.0
servers:
  - url: /api/v1
    description: Local Dev Server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securePassword123!
                displayName:
                  type: string
                  maxLength: 120
                  example: John Doe
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      summary: Login user and retrieve JWT tokens
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123!
                deviceId:
                  type: string
                  example: 'web-client-chrome-1234'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                  - user
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refreshToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      summary: Refresh access token using a valid refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Invalidate user session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/enable:
    post:
      summary: Initiate 2FA TOTP setup
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA initialization details returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - qrCodeUrl
                properties:
                  secret:
                    type: string
                    example: 'KVKFKRCSN5RHK33O'
                  qrCodeUrl:
                    type: string
                    example: 'otpauth://totp/FinMate:user@example.com?secret=KVKFKRCSN5RHK33O&issuer=FinMate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/verify:
    post:
      summary: Verify and complete 2FA setup
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: '123456'
      responses:
        '200':
          description: 2FA enabled successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/disable:
    post:
      summary: Disable 2FA for the account
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: '123456'
      responses:
        '204':
          description: 2FA disabled successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - profile
                properties:
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  profile:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                avatarUrl:
                  type: string
                  format: uri
                locale:
                  type: string
                  example: 'en-IN'
                timezone:
                  type: string
                  example: 'Asia/Kolkata'
                defaultCurrency:
                  type: string
                  maxLength: 3
                  example: 'INR'
                monthlyBudget:
                  type: number
                  minimum: 0
                  example: 50000.00
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - profile
                properties:
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  profile:
                    $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      summary: Deactivate user account
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deactivated successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /users/lookup:
    get:
      summary: Lookup user by identifier and return wrapping key metadata
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  publicWrappingKey:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  email:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/me/keys:
    get:
      summary: Get current user's wrapping keys
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wrapping keys retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicWrappingKey:
                    type: string
                    nullable: true
                  encryptedPrivateWrappingKey:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Save current user's wrapping keys
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicWrappingKey
                - encryptedPrivateWrappingKey
              properties:
                publicWrappingKey:
                  type: string
                encryptedPrivateWrappingKey:
                  type: string
      responses:
        '200':
          description: Wrapping keys saved
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/{id}/public-key:
    get:
      summary: Get a user's public wrapping key
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public wrapping key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  publicWrappingKey:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /invite-links/{inviteToken}:
    get:
      summary: Resolve invite link metadata
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: inviteToken
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite details retrieved
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/join/{inviteToken}:
    post:
      summary: Join a group by invite token
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: inviteToken
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group join accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/GroupMember'
                  wrappedGroupKey:
                    type: string
                    nullable: true
                  groupKeyVersionId:
                    type: string
                    format: uuid
                    nullable: true
                  groupKeyVersion:
                    type: integer
                    nullable: true
                  groupId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/invites:
    post:
      summary: Create a secure invite token with optional wrapped group key
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wrappedGroupKey:
                  type: string
      responses:
        '200':
          description: Invite created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{id}/keys:
    post:
      summary: Provision wrapped group keys for members
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keys
              properties:
                keys:
                  type: array
                  items:
                    type: object
                    required:
                      - userId
                      - wrappedKey
                    properties:
                      userId:
                        type: string
                        format: uuid
                      wrappedKey:
                        type: string
      responses:
        '200':
          description: Group keys provisioned
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{id}/keys/me:
    get:
      summary: Get caller wrapped group key
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wrapped key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  groupKeyVersionId:
                    type: string
                    format: uuid
                    nullable: true
                  groupKeyVersion:
                    type: integer
                    nullable: true
                  wrappedKey:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/{id}/keys/missing:
    get:
      summary: List members missing wrapped group keys
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Missing member IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{id}/keys/rotate:
    post:
      summary: Rotate group key and create new active key version
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keys
              properties:
                reason:
                  type: string
                  maxLength: 255
                keys:
                  type: array
                  items:
                    type: object
                    required:
                      - userId
                      - wrappedKey
                    properties:
                      userId:
                        type: string
                        format: uuid
                      wrappedKey:
                        type: string
      responses:
        '200':
          description: Group key rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  groupKeyVersionId:
                    type: string
                    format: uuid
                  groupKeyVersion:
                    type: integer
                  status:
                    type: string
                    enum: [ACTIVE]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups:
    post:
      summary: Create an expense group
      tags:
        - Groups
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: 'Flatmates Goa Trip'
                description:
                  type: string
                  example: 'Sharing expenses for our trip to Goa'
                visibility:
                  type: string
                  enum: [private, invite_only, public_readonly]
                  default: private
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      summary: List groups current user is a member of
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: isArchived
          in: query
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/{id}:
    get:
      summary: Get details of a group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update group metadata or archive group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                name:
                  type: string
                  maxLength: 120
                description:
                  type: string
                visibility:
                  type: string
                  enum: [private, invite_only, public_readonly]
                isArchived:
                  type: boolean
                version:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/members:
    post:
      summary: Invite or add a member to the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: friend@example.com
                identifier:
                  type: string
                  example: friend@example.com
                role:
                  type: string
                  enum: [admin, member, viewer, spectator]
                  default: member
                displayName:
                  type: string
                wrappedGroupKey:
                  type: string
                inviteKeyHash:
                  type: string
      responses:
        '201':
          description: Member added/invited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    get:
      summary: List all members of the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of group members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/members/{memberId}:
    patch:
      summary: Update a group member role or join status
      description: |
        Used by admins to modify member roles, or by the member themselves to accept/decline/leave group.
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [owner, admin, member, viewer, spectator]
                joinStatus:
                  type: string
                  enum: [invited, active, left, removed]
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Remove a member from the group or leave the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/expenses/deleted:
    get:
      summary: List soft-deleted expenses for the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of deleted expenses retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{id}/carry-forward:
    get:
      summary: Get the carry-forward balance summary for a specific month
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: '2026-06'
      responses:
        '200':
          description: Carry-forward summary retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarryForwardBalance'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{id}/close-month:
    post:
      summary: Close the billing month and roll over carry-forward balances
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
