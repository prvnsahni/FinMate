            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notes/{id}:
    get:
      summary: Get specific note details
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                title:
                  type: string
                  maxLength: 1000
                body:
                  type: string
                visibility:
                  type: string
                  enum: [private, group]
                groupId:
                  type: string
                  format: uuid
                  nullable: true
                version:
                  type: integer
                  example: 5
      responses:
        '200':
          description: Note updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
    delete:
      summary: Delete a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Note deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Goals-v2 (BATCH-11 / W-GOAL-01..03). Born-E2EE (title is client ciphertext;
  # server never decrypts). Owner-scoped. Whole surface gated behind the
  # feature.goals flag (404 when OFF). Creating a goal requires recovery (REC-1).
  /goals:
    get:
      summary: List the caller's goals (owner-scoped, priority-ordered)
      tags: [Goals]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Goals retrieved (title returned as ciphertext)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a goal (born-E2EE title; requires recovery — REC-1)
      tags: [Goals]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, encryptedContentKey, targetAmount, currency]
              properties:
                title:
                  type: string
                  description: E2EE ciphertext of the title — the server never decrypts it.
                encryptedContentKey:
                  type: string
                  description: Owner's RSA-wrapped per-goal content key (born-E2EE).
                targetAmount: { type: number, format: float }
                savedAmount: { type: number, format: float }
                currency: { type: string, maxLength: 3 }
                targetDate: { type: string, format: date }
                priority: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Goal created
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Recovery not configured (errorCode REC_RECOVERY_REQUIRED)
  /goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a goal (owner-scoped; title returned as ciphertext)
      tags: [Goals]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Goal retrieved }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      summary: Update a goal (owner-scoped; optimistic version)
      tags: [Goals]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                title: { type: string }
                encryptedContentKey: { type: string }
                targetAmount: { type: number }
                savedAmount: { type: number }
                currency: { type: string, maxLength: 3 }
                targetDate: { type: string, format: date }
                priority: { type: integer, minimum: 0 }
                status: { type: string, enum: [active, achieved, paused, cancelled] }
      responses:
        '200': { description: Goal updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '412': { $ref: '#/components/responses/PreconditionFailedError' }
    delete:
      summary: Delete a goal (owner-scoped; crypto-shreds the wrapped key)
      tags: [Goals]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Goal deleted }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /goals/{id}/projection:
    get:
      summary: Deterministic goal projection (Goal Engine V1, numeric only)
      tags: [Goals]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: assumedMonthlyContribution
          in: query
          required: false
          schema: { type: number }
      responses:
        '200':
          description: Projection (status ok/insufficient_data/invalid_goal; no free-text)
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /import/expenses:
    post:
      summary: Upload CSV/XLSX to import expenses
      description: |
        Imports raw transactions into drafts or posted expenses.
      tags:
        - Import/Export
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV or XLSX file containing expense transactions.
                groupId:
                  type: string
                  format: uuid
                  description: Optional group to associate imported expenses with.
      responses:
        '200':
          description: Import processed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - successCount
                  - errorCount
                  - errors
                properties:
                  successCount:
                    type: integer
                    example: 12
                  errorCount:
                    type: integer
                    example: 1
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                          example: 5
                        message:
                          type: string
                          example: 'Missing required field: amount'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /export/expenses:
    get:
      summary: Export expenses as CSV or XLSX
      tags:
        - Import/Export
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
          required: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: File download containing exported expenses
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="expenses_export_20260609.csv"'
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # In-app ranked notifications (BATCH-12 / W-NOT-01). Computed & read-only; gated
  # behind the notifications.inApp feature flag (returns an empty list when OFF).
  /notifications:
    get:
      summary: List the caller's ranked in-app notifications
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: whileAway
          in: query
          required: false
          description: When 'true', returns the smaller capped "while you were away" summary.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Ranked notifications (empty when the feature flag is OFF)
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        category:
                          type: string
                          enum: [security, recurring, settlement, reminder, finance]
                        level: { type: integer, minimum: 1, maximum: 5 }
                        title: { type: string }
                        message: { type: string }
                        actionable: { type: boolean }
                        observedAt: { type: string, format: date-time }
                  control:
                    type: string
                    enum: [quieter, standard, off]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /notifications/{id}/seen:
    post:
      summary: Mark a notification seen (or acted) for the caller
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acted:
                  type: boolean
                  description: When true the item is "acted" (also suppressed).
      responses:
        '200':
          description: Notification state updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /notifications/preferences:
    put:
      summary: Set the caller's 3-way notification control
      tags:
        - Notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [control]
              properties:
                control:
                  type: string
                  enum: [quieter, standard, off]
      responses:
        '200':
          description: Preference updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Number of elements per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/auth/register'
            errorCode: 'VAL_INVALID_INPUT'
            message: 'Input validation failed'
            details:
              - field: 'email'
                issue: 'must be a valid email address'
            retryable: false

    UnauthorizedError:
      description: Authentication failed or token missing/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/users/me'
            errorCode: 'AUTH_TOKEN_EXPIRED'
            message: 'JWT access token has expired'
            retryable: false

    ForbiddenError:
      description: Permissions not met for resource action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/groups/d3b07384-d113-49c3-a558-f54248880bf6'
            errorCode: 'RES_FORBIDDEN'
            message: 'You do not have access to view this group.'
            retryable: false

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/expenses/f81d4fae-7dec-11d0-a765-00a0c91e6bf6'
            errorCode: 'RES_NOT_FOUND'
            message: 'Expense with ID f81d4fae-7dec-11d0-a765-00a0c91e6bf6 does not exist.'
            retryable: false

    ConflictError:
      description: Resource constraint or duplication conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/auth/register'
            errorCode: 'RES_ALREADY_EXISTS'
            message: 'A user with email user@example.com already exists.'
            retryable: false

    PreconditionFailedError:
      description: State conflict or optimistic lock version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 412
            timestamp: '2026-06-09T17:15:00.000Z'
            path: '/api/v1/expenses/f81d4fae-7dec-11d0-a765-00a0c91e6bf6'
            errorCode: 'CON_VERSION_CONFLICT'
            message: 'The resource version has changed. Please fetch the latest state and retry.'
            retryable: true

  schemas:
    PersonSummary:
      type: object
      required:
        - counterpartyUserId
        - displayName
        - email
        - currency
        - netBalance
        - direction
      properties:
        counterpartyUserId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        currency:
          type: string
        netBalance:
          type: number
          description: Signed from the caller's perspective; > 0 means they owe you.
        direction:
          type: string
          enum: [owes_you, you_owe, settled]
    PersonHistoryItem:
      type: object
      required:
        - id
        - source
        - amount
        - currency
        - date
      properties:
        id:
          type: string
        source:
          type: string
          enum: [group_expense, direct, settlement]
        entryType:
          type: string
          enum: [lend, borrow, settlement]
        amount:
          type: number
          description: Signed from the caller's perspective.
        currency:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        expenseId:
          type: string
          format: uuid
        title:
          type: string
          description: Expense title — E2EE ciphertext; decrypt client-side.
    RecurringExpenseResponse:
      type: object
      required:
        - id
        - title
        - amountTotal
        - currency
        - category
        - paidByUserId
        - ownerUserId
        - groupId
        - frequency
        - startDate
        - nextOccurrenceDate
        - status
        - splits
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        amountTotal:
          type: number
        currency:
          type: string
        category:
          type: string
        paidByUserId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        groupId:
