<div class="space-y-8 animate-fade-in">
  <!-- HOME TAB VIEW -->
  @if (activeTab === 'Home') {
    <app-dashboard-home
      [userName]="userName"
      [totalBalance]="totalBalance"
      [monthlyExpenses]="monthlyExpenses"
      [activeGroupsCount]="activeGroupsCount"
      [personalExpenses]="personalExpenses"
      [myExpenses]="filteredMyExpenses"
      [tagNameMap]="tagNameMap"
      [expenseViewFilter]="expenseViewFilter"
      [hasMoreExpenses]="hasMoreMyExpenses"
      [isLoadingMoreExpenses]="isLoadingMoreExpenses"
      [pendingInvitations]="pendingInvitations"
      [categoryAnalytics]="categoryAnalytics"
      [userProfile]="userProfile"
      [isLoading]="isLoading"
      [isEditingIncome]="isEditingIncome"
      [(newIncome)]="newIncome"
      [(newBudget)]="newBudget"
      [incomePercentage]="incomePercentage"
      [budgetPercentage]="budgetPercentage"
      [incomeProgressWidth]="incomeProgressWidth"
      [budgetProgressWidth]="budgetProgressWidth"
      (openExpenseModalEvent)="openExpenseModal($event.expense, $event.category)"
      (openExportModalEvent)="openExportModal()"
      (toggleEditIncomeEvent)="toggleEditIncome()"
      (saveIncomeEvent)="saveIncome()"
      (acceptInvitationEvent)="acceptInvitation($event)"
      (declineInvitationEvent)="declineInvitation($event)"
      (confirmDeleteExpenseEvent)="confirmDeleteExpense($event)"
      (expenseViewFilterChange)="setExpenseViewFilter($event)"
      (loadMoreExpensesEvent)="loadMoreMyExpenses()"
      (openGroupExpenseEvent)="openGroupExpense($event)"
    ></app-dashboard-home>
  }

  <!-- ANALYTICS TAB VIEW -->
  @if (activeTab === 'Analytics') {
    <app-dashboard-analytics
      [userProfile]="userProfile"
    ></app-dashboard-analytics>
  }

  <!-- GOALS TAB VIEW -->
  @if (activeTab === 'Goals') {
    <app-dashboard-goals></app-dashboard-goals>
  }

  <!-- SETTINGS TAB VIEW -->
  @if (activeTab === 'Settings') {
    <app-dashboard-settings
      [(newCurrency)]="newCurrency"
      [(newIncome)]="newIncome"
      [(newBudget)]="newBudget"
      [currencyOptions]="currencyOptions"
      [aiOptIn]="aiOptIn"
      (toggleAiOptInEvent)="toggleAiOptIn($event)"
      (saveIncomeEvent)="saveIncome()"
    ></app-dashboard-settings>

    <!-- TAG-BATCH-C5a — personal custom-tag management (E2EE names, client-side). -->
    <div class="mt-6 bg-finmate-card/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-border/10 rounded-3xl p-6 shadow-xl shadow-black/5">
      <app-custom-tag-management scope="personal"></app-custom-tag-management>
    </div>
  }

  <!-- PROFILE TAB VIEW -->
  @if (activeTab === 'Profile') {
    <app-dashboard-profile
      [userName]="userName"
      [userDisplayName]="userDisplayName"
      [userEmail]="userEmail"
      [userProfile]="userProfile"
      [personalExpensesCount]="personalExpenses.length"
      [incomePercentage]="incomePercentage"
      [isLoggingOut]="isLoggingOut"
      (logoutEvent)="logout()"
      (profileUpdated)="handleProfileUpdated($event)"
    ></app-dashboard-profile>
  }
</div>

<!-- Modal Components -->
@if (isExpenseModalOpen) {
  <app-create-expense-modal
    [groupId]="null"
    [groupCurrency]="userProfile?.defaultCurrency || 'USD'"
    [members]="[]"
    [expense]="selectedExpenseForEdit"
    [defaultCategory]="quickLogCategory"
    (closeModalEvent)="closeExpenseModal()"
    (expenseCreated)="onExpenseCreated()"
  ></app-create-expense-modal>
}

@if (isExportModalOpen) {
  <app-export-transactions-modal
    [defaultCurrency]="userProfile?.defaultCurrency || 'USD'"
    (closeModalEvent)="closeExportModal()"
  ></app-export-transactions-modal>
}

@if (isDeleteConfirmOpen) {
  <app-confirm-modal
    [title]="'Delete Personal Expense'"
    [message]="'Are you sure you want to delete this personal expense?'"
    [confirmText]="'Delete'"
    [type]="'danger'"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()"
  ></app-confirm-modal>
}
